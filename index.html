<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIME</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070708;
color:#f3f3f3;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:25px 15px
}

.card{
width:min(760px,100%);
text-align:center
}

.logo{
font-size:64px;
font-weight:900;
letter-spacing:6px
}

.subtitle{
color:#999;
letter-spacing:5px;
margin:4px 0 36px
}

.box{
background:#111;
border:1px solid #292929;
border-radius:18px;
padding:25px 20px;
margin-bottom:18px
}

h2,h3{
margin-top:0
}

p{
color:#999
}

.main-buttons{
display:flex;
flex-direction:column;
gap:10px;
margin-top:18px
}

.btn{
width:100%;
border:0;
border-radius:12px;
padding:15px;
font-size:16px;
font-weight:700;
cursor:pointer
}

.register{
background:#fff;
color:#000
}

.login{
background:#222;
color:#fff;
border:1px solid #444
}

.game{
background:#151515;
color:#fff;
border:1px solid #555
}

.form-page{
display:none
}

input{
width:100%;
padding:15px;
margin:7px 0;
border-radius:10px;
border:1px solid #333;
background:#080808;
color:#fff;
font-size:16px
}

.member{
display:none
}

.credit{
font-size:38px;
font-weight:800;
margin:12px 0 20px
}

.wallet{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
align-items:center;
justify-content:center;
padding:20px;
z-index:9999
}

.modal.show{
display:flex
}

.modal-box{
width:min(390px,100%);
background:#151515;
border:1px solid #333;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.6)
}

.qr-wrap{
background:#fff;
width:250px;
height:250px;
margin:18px auto;
padding:15px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center
}

.qr-wrap img{
width:100%;
height:100%;
image-rendering:pixelated;
object-fit:contain
}

.small{
font-size:12px;
color:#777
}
</style>
</head>

<body>

<section id="homePage" class="page">
<main class="card">

<div class="logo">PRIME</div>
<div class="subtitle">MEMBER</div>

<div id="guestPanel">

<div class="box">
<h2>สมัครสมาชิก</h2>
<p>สร้างบัญชีสมาชิกใหม่</p>

<div class="main-buttons">
<button class="btn register"
onclick="showPage('registerPage')">
สมัครสมาชิก
</button>
</div>
</div>

<div class="box">
<h2>เข้าสู่ระบบ</h2>
<p>สำหรับสมาชิก</p>

<div class="main-buttons">
<button class="btn login"
onclick="showPage('loginPage')">
ล็อกอิน
</button>
</div>
</div>

<div class="box">
<h2>เข้าเล่นเกม</h2>
<p>ระบบเกม</p>

<div class="main-buttons">
<button class="btn game"
onclick="enterGame()">
เข้าเล่นเกม
</button>
</div>
</div>

</div>


<div id="memberPanel" class="box member">

<h2 id="memberName">สมาชิก</h2>

<p>ยอดเครดิตปัจจุบัน</p>

<div class="credit" id="creditAmount">
฿0
</div>

<div class="wallet">

<button class="btn register"
onclick="openDeposit()">
💰 เติมเงิน
</button>

<button class="btn login"
onclick="withdrawCredit()">
🏦 ถอนเงิน
</button>

</div>

<div class="main-buttons">

<button class="btn game"
onclick="enterGame()">
🎮 เข้าเล่นเกม
</button>

<button class="btn login"
onclick="logout()">
ออกจากระบบ
</button>

</div>

</div>

</main>
</section>


<section id="registerPage" class="page form-page">

<main class="card">

<div class="logo">PRIME</div>

<div class="box">

<h2>สมัครสมาชิก</h2>

<input
id="registerName"
placeholder="ชื่อสมาชิก">

<input
id="registerPhone"
type="tel"
placeholder="เบอร์โทรศัพท์">

<input
id="registerPassword"
type="password"
placeholder="รหัสผ่าน">

<h3 style="margin-top:20px">
ข้อมูลบัญชีธนาคาร
</h3>

<input
id="registerBank"
placeholder="ธนาคาร">

<input
id="registerAccount"
placeholder="เลขบัญชีธนาคาร">

<input
id="registerAccountName"
placeholder="ชื่อบัญชีธนาคาร">

<div class="main-buttons">

<button
class="btn register"
onclick="register()">
สมัครสมาชิก
</button>

<button
class="btn login"
onclick="showPage('homePage')">
กลับ
</button>

</div>

</div>

</main>
</section>


<section id="loginPage" class="page form-page">

<main class="card">

<div class="logo">PRIME</div>

<div class="box">

<h2>เข้าสู่ระบบ</h2>

<input
id="loginPhone"
type="tel"
placeholder="เบอร์โทรศัพท์">

<input
id="loginPassword"
type="password"
placeholder="รหัสผ่าน">

<div class="main-buttons">

<button
class="btn register"
onclick="login()">
ล็อกอิน
</button>

<button
class="btn login"
onclick="showPage('homePage')">
กลับ
</button>

</div>

</div>

</main>
</section>


<!-- QR PAYMENT -->

<div id="qrModal" class="modal">

<div class="modal-box">

<h2>💰 ชำระเงิน</h2>

<p>
สแกน QR Code เพื่อชำระเงิน
</p>

<div class="qr-wrap">

<img
id="paymentQR"
alt="QR สำหรับชำระเงิน">

</div>

<p class="small">
QR สำหรับชำระเงิน
</p>

<button
class="btn login"
onclick="closeQR()">
ปิด
</button>

</div>

</div>


<!-- GAME ALERT -->

<div id="gameModal" class="modal">

<div class="modal-box">

<h2>แจ้งเตือน</h2>

<p>
ยอดเครดิตในการเข้าเล่นต้องมากกว่า 1 บาท
</p>

<button
class="btn register"
onclick="closeGameModal()">
ตกลง
</button>

</div>

</div>


<script>

/*
QR จริงของคุณ
ฝังเป็น PNG ในโค้ดแล้ว
*/

const PAYMENT_QR =
"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAC0AAAAtAQAAAAASYd83AAABLElEQVR42mP8z8DAwPCTiYGBgYGBAZVi+agVfqV6BxP7kb/h8gyMX1KfbY1VZ2Jg+bmbgYGJgUFpUQMDE3PpE1U+BsYPqg4Mry0Y/v9m66j/wfJ9gZC4AAPjx323Y2b9YPz85ObJe4pMDKl/7jMyMHEKpLr+ZWD48d95jskPpr/Xwiw1GBh+71QyWv2DheXK2+Dqsww/1itZdf9g/BH65ZqLLMOfz7+fW/xg/DhrxwtBG8ZfesGGbxKYfhft/mrawPDnz+89whVMDKwnOtgZGP5tYr114gfj18u8WsxlLKzvn6VtdGUucZD9Uv+H4f8nsTXlP5g+qj2Vv9fA+P3m9wsPGJn+9q7908nAxPDrmn5fAwsD66V+tleM3x+eOyJSxfTT5sCL4AZGPMEDAFi/erGh4V1jAAAAAElFTkSuQmCC";


let credit =
Number(
localStorage.getItem("primeCredit") || 0
);


/* เปลี่ยนหน้า */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(x=>{
x.style.display="none";
});

document
.getElementById(id)
.style.display="flex";

}


/* เครดิต */

function updateCredit(){

document
.getElementById("creditAmount")
.textContent="฿"+credit;

localStorage.setItem(
"primeCredit",
credit
);

}


/* สมัครสมาชิก */

function register(){

const name =
document
.getElementById("registerName")
.value.trim();

const phone =
document
.getElementById("registerPhone")
.value.trim();

const password =
document
.getElementById("registerPassword")
.value.trim();

const bank =
document
.getElementById("registerBank")
.value.trim();

const account =
document
.getElementById("registerAccount")
.value.trim();

const accountName =
document
.getElementById("registerAccountName")
.value.trim();


if(
!name ||
!phone ||
!password ||
!bank ||
!account ||
!accountName
){

alert("กรุณากรอกข้อมูลให้ครบ");

return;

}


localStorage.setItem(
"primeUser",
JSON.stringify({

name:name,
phone:phone,
password:password,
bank:bank,
account:account,
accountName:accountName

})
);


loginMember(name);

alert("สมัครสมาชิกเรียบร้อย");

}


/* ล็อกอิน */

function login(){

const phone =
document
.getElementById("loginPhone")
.value.trim();

const password =
document
.getElementById("loginPassword")
.value.trim();

const saved =
localStorage.getItem("primeUser");


if(!saved){

alert("ยังไม่มีบัญชีสมาชิก");

return;

}


const user =
JSON.parse(saved);


if(
phone !== user.phone ||
password !== user.password
){

alert("เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง");

return;

}


loginMember(user.name);

}


/* เข้าสมาชิก */

function loginMember(name){

document
.getElementById("guestPanel")
.style.display="none";

document
.getElementById("memberPanel")
.style.display="block";

document
.getElementById("memberName")
.textContent=name;

updateCredit();

showPage("homePage");

}


/* ออกจากระบบ */

function logout(){

document
.getElementById("guestPanel")
.style.display="block";

document
.getElementById("memberPanel")
.style.display="none";

showPage("homePage");

}


/* เปิด QR */

function openDeposit(){

document
.getElementById("paymentQR")
.src=PAYMENT_QR;

document
.getElementById("qrModal")
.classList.add("show");

}


/* ปิด QR */

function closeQR(){

document
.getElementById("qrModal")
.classList.remove("show");

}


/* ถอน */

function withdrawCredit(){

const amount =
Number(
prompt(
"กรอกจำนวนเครดิตที่ต้องการถอน"
)
);


if(
!amount ||
amount<=0
){

alert(
"กรุณากรอกจำนวนให้ถูกต้อง"
);

return;

}


if(amount>credit){

alert(
"เครดิตไม่เพียงพอ"
);

return;

}


credit-=amount;

updateCredit();

alert(
"ถอนเครดิตเรียบร้อย"
);

}


/* เข้าเกม */

function enterGame(){

if(credit<=1){

document
.getElementById("gameModal")
.classList.add("show");

return;

}

alert(
"เข้าสู่หน้าเกม"
);

}


/* ปิดแจ้งเตือน */

function closeGameModal(){

document
.getElementById("gameModal")
.classList.remove("show");

}


/* เริ่มต้น */

showPage("homePage");

</script>

</body>
</html>
