<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIME</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070708;
  color:#f3f3f3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
}

.card{
  width:min(760px,100%);
  text-align:center;
}

.logo{
  font-size:64px;
  font-weight:900;
  letter-spacing:6px;
}

.subtitle{
  color:#999;
  letter-spacing:5px;
  margin:4px 0 36px;
}

.box{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:25px 20px;
  margin-bottom:18px;
}

h2,h3{
  margin-top:0;
}

p{
  color:#999;
}

.main-buttons{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.register{
  background:#fff;
  color:#000;
}

.login{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.game{
  background:#151515;
  color:#fff;
  border:1px solid #555;
}

.form-page{
  display:none;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#080808;
  color:#fff;
  font-size:16px;
}

.credit{
  font-size:38px;
  font-weight:800;
  margin:12px 0 20px;
}

.member{
  display:none;
}

.wallet{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.wallet button{
  padding:14px 8px;
}

.note{
  color:#555;
  font-size:12px;
  margin-top:20px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(380px,100%);
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  padding:28px;
  text-align:center;
}

.close{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:700;
  margin-top:15px;
}
</style>
</head>

<body>

<!-- HOME -->
<section id="homePage" class="page">
<main class="card">

<div class="logo">PRIME</div>
<div class="subtitle">MEMBER</div>

<!-- GUEST -->
<div id="guestPanel">

  <div class="box">
    <h2>สมัครสมาชิก</h2>
    <p>สร้างบัญชีสมาชิกใหม่</p>

    <div class="main-buttons">
      <button class="btn register"
      onclick="showPage('registerPage')">
        สมัครสมาชิก
      </button>
    </div>
  </div>

  <div class="box">
    <h2>เข้าสู่ระบบ</h2>
    <p>สำหรับสมาชิก</p>

    <div class="main-buttons">
      <button class="btn login"
      onclick="showPage('loginPage')">
        ล็อกอิน
      </button>
    </div>
  </div>

  <div class="box">
    <h2>เข้าเล่นเกม</h2>
    <p>ระบบเกม</p>

    <div class="main-buttons">
      <button class="btn game"
      onclick="enterGame()">
        เข้าเล่นเกม
      </button>
    </div>
  </div>

</div>


<!-- MEMBER -->
<div id="memberPanel" class="box member">

  <h2 id="memberName">สมาชิก</h2>

  <p>ยอดเครดิตปัจจุบัน</p>

  <div class="credit" id="creditAmount">
    ฿0
  </div>


  <!-- เติม / ถอน -->
  <div class="wallet">

    <button class="btn register"
    onclick="addCredit()">
      💰 เติมเงิน
    </button>

    <button class="btn login"
    onclick="withdrawCredit()">
      🏦 ถอนเงิน
    </button>

  </div>


  <!-- เข้าเกม / ออก -->
  <div class="main-buttons">

    <button class="btn game"
    onclick="enterGame()">
      🎮 เข้าเล่นเกม
    </button>

    <button class="btn login"
    onclick="logout()">
      ออกจากระบบ
    </button>

  </div>

</div>

<div class="note">
  PRIME • ระบบเครดิตปลอมสำหรับสาธิต
</div>

</main>
</section>


<!-- REGISTER -->
<section id="registerPage" class="page form-page">

<main class="card">

<div class="logo">PRIME</div>

<div class="box">

<h2>สมัครสมาชิก</h2>

<input
id="registerName"
type="text"
placeholder="ชื่อสมาชิก">

<input
id="registerPhone"
type="text"
placeholder="เบอร์โทรศัพท์">

<input
id="registerPassword"
type="password"
placeholder="รหัสผ่าน">

<div class="main-buttons">

<button
class="btn register"
onclick="register()">
สมัครสมาชิก
</button>

<button
class="btn login"
onclick="showPage('homePage')">
กลับ
</button>

</div>

</div>

</main>
</section>


<!-- LOGIN -->
<section id="loginPage" class="page form-page">

<main class="card">

<div class="logo">PRIME</div>

<div class="box">

<h2>เข้าสู่ระบบ</h2>

<input
id="loginPhone"
type="text"
placeholder="เบอร์โทรศัพท์">

<input
id="loginPassword"
type="password"
placeholder="รหัสผ่าน">

<div class="main-buttons">

<button
class="btn register"
onclick="login()">
ล็อกอิน
</button>

<button
class="btn login"
onclick="showPage('homePage')">
กลับ
</button>

</div>

</div>

</main>
</section>


<!-- GAME MODAL -->
<div id="gameModal" class="modal">

<div class="modal-box">

<h2>แจ้งเตือน</h2>

<p>
ยอดเครดิตในการเข้าเล่นต้องมากกว่า 1 บาท
</p>

<button
class="close"
onclick="closeGameModal()">
ตกลง
</button>

</div>
</div>


<script>

/* =========================
   ตัวแปรหลัก
========================= */

let credit = Number(
  localStorage.getItem("primeCredit") || 0
);


/* =========================
   เปลี่ยนหน้า
========================= */

function showPage(id){

  document.querySelectorAll(".page")
  .forEach(page=>{
    page.style.display="none";
  });

  document.getElementById(id)
  .style.display="flex";
}


/* =========================
   อัปเดตเครดิต
========================= */

function updateCredit(){

  document.getElementById("creditAmount")
  .textContent="฿"+credit;

  localStorage.setItem(
    "primeCredit",
    credit
  );
}


/* =========================
   สมัครสมาชิก
========================= */

function register(){

  const name=
    document.getElementById("registerName").value.trim();

  const phone=
    document.getElementById("registerPhone").value.trim();

  const password=
    document.getElementById("registerPassword").value.trim();

  if(!name || !phone || !password){

    alert("กรุณากรอกข้อมูลให้ครบ");

    return;
  }

  const user={
    name:name,
    phone:phone,
    password:password
  };

  localStorage.setItem(
    "primeUser",
    JSON.stringify(user)
  );

  loginMember(name);

  alert("สมัครสมาชิกเรียบร้อย");
}


/* =========================
   ล็อกอิน
========================= */

function login(){

  const phone=
    document.getElementById("loginPhone").value.trim();

  const password=
    document.getElementById("loginPassword").value.trim();

  const saved=
    localStorage.getItem("primeUser");

  if(!saved){

    alert("ยังไม่มีบัญชีสมาชิก");

    return;
  }

  const user=JSON.parse(saved);

  if(
    phone!==user.phone ||
    password!==user.password
  ){

    alert("เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง");

    return;
  }

  loginMember(user.name);
}


/* =========================
   เข้าสู่สมาชิก
========================= */

function loginMember(name){

  document.getElementById("guestPanel")
  .style.display="none";

  document.getElementById("memberPanel")
  .style.display="block";

  document.getElementById("memberName")
  .textContent=name;

  updateCredit();

  showPage("homePage");
}


/* =========================
   ออกจากระบบ
========================= */

function logout(){

  document.getElementById("guestPanel")
  .style.display="block";

  document.getElementById("memberPanel")
  .style.display="none";

  showPage("homePage");
}


/* =========================
   เติมเงิน
========================= */

function addCredit(){

  const amount=Number(
    prompt("กรอกจำนวนเครดิตที่ต้องการเติม")
  );

  if(!amount || amount<=0){

    alert("กรุณากรอกจำนวนให้ถูกต้อง");

    return;
  }

  credit += amount;

  updateCredit();

  alert(
    "เติมเครดิตเรียบร้อย\nยอดเครดิต ฿"+credit
  );
}


/* =========================
   ถอนเงิน
========================= */

function withdrawCredit(){

  const amount=Number(
    prompt("กรอกจำนวนเครดิตที่ต้องการถอน")
  );

  if(!amount || amount<=0){

    alert("กรุณากรอกจำนวนให้ถูกต้อง");

    return;
  }

  if(amount>credit){

    alert("เครดิตไม่เพียงพอ");

    return;
  }

  credit -= amount;

  updateCredit();

  alert(
    "ถอนเครดิตเรียบร้อย\nยอดเครดิต ฿"+credit
  );
}


/* =========================
   เข้าเกม
========================= */

function enterGame(){

  if(credit<=1){

    document
    .getElementById("gameModal")
    .classList.add("show");

    return;
  }

  alert("เข้าสู่หน้าเกม");
}


/* =========================
   ปิดแจ้งเตือน
========================= */

function closeGameModal(){

  document
  .getElementById("gameModal")
  .classList.remove("show");
}


/* =========================
   เปิดหน้าแรก
========================= */

showPage("homePage");

</script>

</body>
</html>
